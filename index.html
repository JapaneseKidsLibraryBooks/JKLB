<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Books for Kids | 日本語の子どもの本さがし</title>
<meta name="description" content="ワシントン州の公共図書館にある日本語の子どもの本を、年齢・学年・ジャンルでさがせます。">
<style>
  :root{
    --bg:#f7f7f6; --card:#fff; --ink:#1f2328; --muted:#5b616b; --line:#e3e5e8;
    --blue:#2196e8; --navy:#1d3a5c; --head:#eef5fb; --radius:12px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.6}
  a{color:var(--ink)}
  header{background:var(--head);position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .wrap{max-width:1760px;margin:0 auto;padding:0 80px}
  .top{display:flex;align-items:center;gap:10px;height:64px}
  .top svg{flex:none}
  .top h1{font-size:1.6rem;margin:0;color:var(--navy);font-weight:700;letter-spacing:.01em}
  .hero{padding:28px 0 4px}
  .hero p{margin:0 0 14px;color:var(--muted)}
  .search input{width:100%;font:inherit;font-size:1.05rem;padding:13px 18px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
  .search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(33,150,232,.15)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .filters select{font:inherit;font-size:.95rem;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
  .filters select.on{border-color:var(--blue);background:#e8f3fd}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 20px;color:var(--muted);flex-wrap:wrap}
  .bar button{font:inherit;border:0;background:none;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;margin-left:8px}
  .bar select{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:background .12s, box-shadow .12s}
  .card:hover,.card:focus-visible{background:#f2f2f2;outline:none}
  .card .cover{position:relative;height:230px;display:flex;justify-content:center;background:transparent}
  .card .cover img{height:100%;max-width:100%;object-fit:contain}
  .badge{position:absolute;top:16px;left:20px;background:#fff;border-radius:6px;padding:2px 8px;font-size:.95rem;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
  .noimg{width:170px;height:100%;background:#eef0f2;color:#9aa1aa;display:grid;place-items:center;font-size:.85rem}
  .body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
  .title{font-weight:700;font-size:1.3rem;line-height:1.45;color:#333}
  .author{font-size:1.1rem;color:#444;margin-top:-4px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:.95rem;padding:1px 8px;border-radius:5px;border:1px solid rgba(0,0,0,.06);white-space:nowrap}
  .isbn{font-size:1.1rem;color:#444}
  .sep{border:0;border-top:1px solid var(--line);margin:4px 0}
  .pub{font-size:1.1rem;color:#444}
  .publink{font-size:1.1rem;color:var(--ink);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more{display:block;margin:30px auto 10px;font:inherit;padding:11px 30px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  dialog{border:0;border-radius:16px;padding:0;max-width:880px;width:calc(100% - 24px);max-height:calc(100% - 24px);background:#f9f9f8}
  dialog::backdrop{background:rgba(20,25,30,.45)}
  .d{padding:44px 36px 36px}
  .d-head{display:flex;gap:24px;align-items:flex-start;margin-bottom:28px}
  .d-head .cover{width:180px;flex:none;border-radius:10px;overflow:hidden}
  .d-head .cover img{width:100%;display:block}
  .d-head .noimg{width:180px;height:180px}
  .d h2{margin:0 0 10px;font-size:1.6rem;line-height:1.4}
  .d-head p{margin:0 0 10px;color:#444;font-size:1.05rem}
  .rows{border-top:0}
  .row{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
  .row:last-child{border-bottom:0}
  .row .k{color:#555;display:flex;align-items:center;gap:8px}
  .row .k svg{width:18px;height:18px;stroke:#555;fill:none;stroke-width:1.8}
  .row a{word-break:break-all;text-underline-offset:3px}
  .chip{display:inline-block;font-size:.95rem;padding:1px 8px;border-radius:5px;margin:0 6px 4px 0;border:1px solid rgba(0,0,0,.08)}
  .chip.blue{background:#cfdfff;border-color:#a9c4f5}
  .libbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
  .libbtns a{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:10px;text-decoration:none;font-size:1.1rem;font-weight:500;background:var(--blue);color:#fff}
  .libbtns a.sub{background:#fff;color:var(--blue);border:1px solid var(--blue);font-size:.95rem;padding:9px 16px}
  .libbtns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
  .close{position:absolute;top:10px;right:14px;border:0;background:none;font-size:1.8rem;cursor:pointer;color:#777;line-height:1;width:40px;height:40px}
  footer{margin-top:50px;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
  @media (max-width:1300px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:980px){.wrap{padding:0 24px}.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:640px){
    .wrap{padding:0 14px}.top h1{font-size:1.1rem}
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .card .cover{height:170px}.badge{top:8px;left:8px;font-size:.8rem}
    .body{padding:14px;gap:6px}.title{font-size:1rem}.author,.isbn,.pub,.publink{font-size:.85rem}.tag{font-size:.78rem}
    .d{padding:40px 18px 24px}.d-head{flex-direction:column}.row{grid-template-columns:1fr;gap:4px}
    .filters select{flex:1 1 45%}
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2196e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
    <h1>Japanese Kids Books Search at KCLS</h1>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p>ワシントン州の公共図書館で借りられる日本語の子どもの本を、年齢・学年・ジャンルからさがせます。</p>
    <div class="search">
      <input id="q" type="search" placeholder="書名・作者・出版社・ISBNでさがす（ひらがな・ローマ字もOK）" autocomplete="off" aria-label="キーワード検索">
    </div>
    <div class="filters">
      <select id="f-age" data-key="age"><option value="">対象年齢：すべて</option></select>
      <select id="f-grade" data-key="grade"><option value="">学年：すべて</option></select>
      <select id="f-format" data-key="format"><option value="">種類：すべて</option></select>
      <select id="f-genre" data-key="genres"><option value="">ジャンル：すべて</option></select>
      <select id="f-lib" data-key="libs"><option value="">図書館：すべて</option></select>
    </div>
  </section>

  <div class="bar">
    <div><strong id="count">0</strong> 冊 <button id="reset" hidden>条件をクリア</button></div>
    <label>並び順
      <select id="sort">
        <option value="new">新しく追加された順</option>
        <option value="title">書名順</option>
        <option value="author">作者順</option>
      </select>
    </label>
  </div>

  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="empty" class="empty" hidden>条件に合う本が見つかりませんでした。条件を減らしてみてください。</p>
  <button id="more" class="more" hidden>もっと見る</button>
</main>

<dialog id="dlg" aria-labelledby="d-title">
  <button class="close" aria-label="閉じる" onclick="dlg.close()">×</button>
  <div id="d-body"></div>
</dialog>

<footer>
  <div class="wrap">
    <p>所蔵状況は各図書館のカタログでご確認ください。対象年齢・学年は絵本ナビ等の情報をもとにした目安です。</p>
    <p>データ最終更新：<span id="updated">-</span></p>
  </div>
</footer>

<script src="books.js"></script>
<script>
(() => {
  const BOOKS = (window.BOOKS || []);
  const LIBS = [
    {name:"King County Library System", short:"KCLS（キング郡）", label:"King County Library", url:i=>`https://kcls.bibliocommons.com/v2/search?query=${i}`},
    {name:"Seattle Public Library", short:"シアトル公共図書館", label:"Seattle Public Library", url:i=>`https://seattle.bibliocommons.com/v2/search?query=${i}&searchType=smart`},
    {name:"Sno-isle Librarys", short:"Sno-Isle Libraries", label:"Sno-Isle Libraries", url:i=>`https://sno-isle.bibliocommons.com/v2/search?query=${i}&searchType=smart`},
    {name:"Pierce County Library System", short:"ピアース郡図書館", label:"Pierce County Library", url:i=>`https://polariscatalog.piercecountylibrary.org/polaris/search/searchresults.aspx?ctx=1.1033.0.0.6&type=Keyword&term=${i}&by=ISBN&sort=RELEVANCE&limit=TOM=*&query=&page=0&searchid=1`},
    {name:"Fort Vancouver Regional Libraries", short:"Fort Vancouver", label:"Fort Vancouver Regional Library", url:i=>`https://fvrlibraries.bibliocommons.com/v2/search?query=${i}&searchType=smart`},
  ];
  const ORDER = {
    age:["0-2歳","3-5歳","6-8歳","9-12歳"],
    grade:["未就学","小学校低学年（1〜2年）","小学校中学年（3〜4年）","小学校高学年（5〜6年）","子どもにかかわるすべての人に"],
    libs:LIBS.map(l=>l.name),
  };
  const PAGE = 48;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // かな正規化：カタカナ→ひらがな、全角→半角、小文字、空白・記号除去
  const norm = s => String(s ?? "").normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s・,，、。.\-ー‐―〜~'’"“”()（）「」『』!！?？:：]/g, "")
    .replace(/[āâ]/g,"a").replace(/[īî]/g,"i").replace(/[ūû]/g,"u").replace(/[ēê]/g,"e").replace(/[ōô]/g,"o");

  BOOKS.forEach((b, i) => {
    b._i = i;
    b._idx = norm([b.title, b.titleEn, b.author, b.authorReading, b.authorEn, b.illustrator, b.illustratorEn, b.supervisor, b.publisher, b.isbn, (b.genres||[]).join(" ")].join(" "));
  });

  // フィルタの選択肢を実データから作る
  const libLabel = n => (LIBS.find(l => l.name === n) || {}).short || n;
  document.querySelectorAll(".filters select").forEach(sel => {
    const key = sel.dataset.key, set = new Map();
    BOOKS.forEach(b => [].concat(b[key] || []).forEach(v => v && v !== "-" && set.set(v, (set.get(v)||0)+1)));
    let vals = [...set.keys()];
    const ord = ORDER[key];
    vals.sort((a,b) => ord ? ((ord.indexOf(a)+1||99) - (ord.indexOf(b)+1||99)) : set.get(b)-set.get(a));
    vals.forEach(v => sel.insertAdjacentHTML("beforeend", `<option value="${esc(v)}">${esc(key==="libs"?libLabel(v):v)}（${set.get(v)}）</option>`));
  });

  const state = {q:"", age:"", grade:"", format:"", genres:"", libs:"", sort:"new", shown:PAGE};

  // URLに条件を保存（共有・戻る対応）
  const readURL = () => { const p = new URLSearchParams(location.search);
    for (const k of ["q","age","grade","format","genres","libs","sort"]) if (p.get(k)) state[k] = p.get(k); };
  const writeURL = () => { const p = new URLSearchParams();
    for (const k of ["q","age","grade","format","genres","libs"]) if (state[k]) p.set(k, state[k]);
    if (state.sort !== "new") p.set("sort", state.sort);
    history.replaceState(null, "", p.toString() ? "?" + p : location.pathname); };

  // Airtable と同じジャンル色
  const C = {blueLight2:"#cfdfff",cyanLight2:"#d0f0fd",tealLight2:"#c2f5e9",greenLight2:"#d1f7c4",yellowLight2:"#ffeab6",orangeLight2:"#fee2d5",redLight2:"#ffdce5",pinkLight2:"#ffdaf6",purpleLight2:"#ede2fe",grayLight2:"#eeeeee",
    blueLight1:"#9cc7ff",cyanLight1:"#77d1f3",tealLight1:"#72ddc3",greenLight1:"#93e088",yellowLight1:"#ffd66e",orangeLight1:"#ffa981",redLight1:"#ff9eb7",pinkLight1:"#f99de2",purpleLight1:"#cdb0ff",grayLight1:"#cccccc",blueBright:"#2d7ff9"};
  const GC = {"生き物・自然":"blueLight2","友情・家族":"cyanLight2","科学":"tealLight2","宇宙":"greenLight2","数学":"yellowLight2","歴史":"orangeLight2","社会":"redLight2","地理":"pinkLight2","美術・アート":"purpleLight2","音楽":"grayLight2","料理":"blueLight1","スポーツ":"cyanLight1","乗り物":"tealLight1","多様性":"greenLight1","感情":"yellowLight1","昔話・民話":"orangeLight1","年中行事":"redLight1","伝統文化":"pinkLight1","詩":"purpleLight1","言葉遊び":"grayLight1","しかけ絵本":"blueLight2","医療":"blueLight2","ファンタジー":"cyanLight2","ノンフィクション":"tealLight2","ミステリー":"greenLight2","未来":"yellowLight2","戦争・平和":"blueLight2","ことわざ・四字熟語":"orangeLight2","写真絵本":"redLight2","体操":"pinkLight2"};
  const genreTags = (b, cls="tag") => (b.genres||[]).map(g => `<span class="${cls}" style="background:${C[GC[g]]||"#eee"}">${esc(g)}</span>`).join("");
  const shortUrl = u => { try { const x = new URL(u); return (x.hostname.replace(/^www\./,"") + x.pathname).replace(/\/$/,""); } catch { return u; } };
  const ICON = {
    book:'<svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>',
    globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
    tag:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    heart:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16.5l-3.5-3.5a2.2 2.2 0 0 1 3.5-2.7 2.2 2.2 0 0 1 3.5 2.7z"/></svg>',
    cap:'<svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>',
    ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  };

  const cover = (b, badge="") => {
    const srcs = b.isbn ? [`covers/${b.isbn}.jpg`, `https://ndlsearch.ndl.go.jp/thumbnail/${b.isbn}.jpg`] : [];
    const bd = badge ? `<span class="badge">${esc(badge)}</span>` : "";
    if (!srcs.length) return `<div class="cover">${bd}<div class="noimg">No Image</div></div>`;
    return `<div class="cover">${bd}<img loading="lazy" alt="" src="${esc(srcs[0])}" data-alt="${esc(srcs[1]||"")}" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else{this.outerHTML='<div class=noimg>No Image</div>'}"></div>`;
  };

  let results = [];
  function filter() {
    const q = norm(state.q);
    const terms = state.q.trim().split(/\s+/).map(norm).filter(Boolean);
    results = BOOKS.filter(b =>
      (!terms.length || terms.every(t => b._idx.includes(t))) &&
      (!state.age || b.age === state.age) &&
      (!state.grade || b.grade === state.grade) &&
      (!state.format || b.format === state.format) &&
      (!state.genres || (b.genres||[]).includes(state.genres)) &&
      (!state.libs || (b.libs||[]).includes(state.libs)));
    const coll = new Intl.Collator("ja");
    if (state.sort === "title") results.sort((a,b) => coll.compare(a.title||"", b.title||""));
    else if (state.sort === "author") results.sort((a,b) => coll.compare(a.authorReading||a.author||"", b.authorReading||b.author||""));
    else results.sort((a,b) => (b.added||"").localeCompare(a.added||"") || a._i - b._i);
    render();
  }

  function render() {
    $("#count").textContent = results.length.toLocaleString();
    $("#reset").hidden = !(state.q || state.age || state.grade || state.format || state.genres || state.libs);
    $("#empty").hidden = results.length > 0;
    if (!BOOKS.length) $("#empty").innerHTML = "本のデータ（books.js）がまだありません。<br>同じフォルダの <b>convert.html</b> を開いて、Airtable の CSV から books.js を作ってください。";
    $("#grid").innerHTML = results.slice(0, state.shown).map(b => `
      <div class="card" role="button" tabindex="0" data-i="${b._i}">
        ${cover(b, b.format)}
        <div class="body">
          <div class="title">${esc(b.title)}</div>
          ${b.author ? `<div class="author">${esc(b.author)}</div>` : ""}
          ${(b.genres||[]).length ? `<div class="tags">${genreTags(b)}</div>` : ""}
          ${b.isbn ? `<div class="isbn">${esc(b.isbn)}</div>` : ""}
          <hr class="sep">
          ${b.publisher ? `<div class="pub">${esc(b.publisher)}</div>` : ""}
          ${b.publisherUrl ? `<a class="publink" href="${esc(b.publisherUrl)}" target="_blank" rel="noopener">${esc(shortUrl(b.publisherUrl))}</a>` : ""}
        </div>
      </div>`).join("");
    $("#more").hidden = results.length <= state.shown;
    $("#more").textContent = `もっと見る（残り ${(results.length - state.shown).toLocaleString()} 冊）`;
    writeURL();
  }

  function openBook(b) {
    const link = u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`;
    const row = (icon, k, html) => html ? `<div class="row"><div class="k">${ICON[icon]}${k}</div><div>${html}</div></div>` : "";
    const chip = v => v && v !== "-" ? `<span class="chip blue">${esc(v)}</span>` : "";
    const libs = b.isbn ? LIBS.map(l => ({...l, has:(b.libs||[]).includes(l.name)})) : [];
    const owned = libs.filter(l => l.has), others = libs.filter(l => !l.has);
    $("#d-body").innerHTML = `<div class="d">
      <div class="d-head">
        ${cover(b)}
        <div>
          <h2 id="d-title">${esc(b.title)}</h2>
          ${b.titleEn ? `<p>${esc(b.titleEn)}</p>` : ""}
          ${b.publisher ? `<p>${esc(b.publisher)}</p>` : ""}
          ${b.author ? `<p>${esc(b.author)}${b.authorEn ? `（${esc(b.authorEn)}）` : ""}</p>` : ""}
          ${b.illustrator ? `<p>絵：${esc(b.illustrator)}</p>` : ""}
          ${b.supervisor ? `<p>監修：${esc(b.supervisor)}</p>` : ""}
        </div>
      </div>
      <div class="rows">
        ${row("book", "絵本ナビ", b.ehonnavi && link(b.ehonnavi))}
        ${row("globe", "公式サイト", b.publisherUrl && link(b.publisherUrl))}
        ${row("tag", "ジャンル", genreTags(b, "chip"))}
        ${row("heart", "参考対象年齢", chip(b.age))}
        ${row("cap", "参考対象学年", chip(b.grade))}
        ${row("tag", "ISBN", esc(b.isbn))}
      </div>
      <div class="libbtns">
        ${owned.map(l => `<a href="${esc(l.url(b.isbn))}" target="_blank" rel="noopener">${ICON.ext}${esc(l.label)}</a>`).join("")}
        ${others.map(l => `<a class="sub" href="${esc(l.url(b.isbn))}" target="_blank" rel="noopener">${ICON.ext}${esc(l.label)}で検索</a>`).join("")}
      </div>
    </div>`;
    $("#dlg").showModal();
    $("#dlg").scrollTop = 0;
  }

  // イベント
  let t;
  $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; filter(); }, 150); });
  document.querySelectorAll(".filters select").forEach(sel => sel.addEventListener("change", () => {
    state[sel.dataset.key] = sel.value; sel.classList.toggle("on", !!sel.value); state.shown = PAGE; filter(); }));
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; filter(); });
  $("#more").addEventListener("click", () => { state.shown += PAGE; render(); });
  $("#reset").addEventListener("click", () => {
    Object.assign(state, {q:"", age:"", grade:"", format:"", genres:"", libs:"", shown:PAGE});
    $("#q").value = ""; document.querySelectorAll(".filters select").forEach(s => { s.value = ""; s.classList.remove("on"); }); filter(); });
  $("#grid").addEventListener("click", e => { if (e.target.closest("a")) return; const c = e.target.closest(".card"); if (c) openBook(BOOKS[+c.dataset.i]); });
  $("#grid").addEventListener("keydown", e => { const c = e.target.closest(".card"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openBook(BOOKS[+c.dataset.i]); } });
  $("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });

  readURL();
  $("#q").value = state.q; $("#sort").value = state.sort;
  document.querySelectorAll(".filters select").forEach(s => { s.value = state[s.dataset.key]; s.classList.toggle("on", !!s.value); });
  $("#updated").textContent = window.BOOKS_UPDATED || "-";
  filter();
})();
</script>
</body>
</html>
